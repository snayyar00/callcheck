[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "callcheck"
version = "0.1.0"
description = "Find turn-taking failures (slow replies, dead air, cut-offs, false barge-ins) in a two-channel call recording."
requires-python = ">=3.10"
dependencies = ["numpy", "onnxruntime"]

[project.optional-dependencies]
stt = ["faster-whisper"]
test = ["pytest"]

[project.scripts]
callcheck = "callcheck.cli:main"

[tool.setuptools]
packages = ["callcheck"]
